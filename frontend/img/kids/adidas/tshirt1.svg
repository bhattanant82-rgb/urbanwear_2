  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- T-shirt silhouette -->
  <path d="M150 100 L250 100 L240 150 L260 200 L240 250 L160 250 L140 200 L160 150 Z" fill="#ffffff" stroke="#e9ecef" stroke-width="2"/>
