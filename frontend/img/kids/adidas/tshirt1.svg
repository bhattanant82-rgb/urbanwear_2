  <ellipse cx="140" cy="140" rx="20" ry="30" fill="#ffffff" stroke="#e9ecef" stroke-width="2"/>
  <ellipse cx="260" cy="140" rx="20" ry="30" fill="#ffffff" stroke="#e9ecef" stroke-width="2"/>
  <!-- Adidas stripes -->
  <rect x="180" y="170" width="40" height="20" fill="#000000"/>
  <rect x="185" y="175" width="5" height="10" fill="#ffffff"/>
  <rect x="195" y="175" width="5" height="10" fill="#ffffff"/>
  <rect x="205" y="175" width="5" height="10" fill="#ffffff"/>
  <text x="200" y="200" text-anchor="middle" fill="#000000" font-family="Arial" font-size="12" font-weight="bold">adidas</text>
  <text x="200" y="350" text-anchor="middle" fill="#666666" font-family="Arial" font-size="14">Kids Graphic T-Shirt</text>
  <text x="200" y="370" text-anchor="middle" fill="#999999" font-family="Arial" font-size="12">Professional Product Image</text>
