<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- Jeans silhouette -->
  <path d="M160 100 L240 100 L235 150 L245 200 L235 300 L225 350 L175 350 L165 300 L155 200 L165 150 Z" fill="#4a90e2" stroke="#e9ecef" stroke-width="2"/>
  <!-- Pockets -->
  <rect x="170" y="120" width="15" height="20" fill="#2c5282" rx="2"/>
  <rect x="215" y="120" width="15" height="20" fill="#2c5282" rx="2"/>
  <rect x="170" y="280" width="15" height="25" fill="#2c5282" rx="2"/>
  <rect x="215" y="280" width="15" height="25" fill="#2c5282" rx="2"/>
  <!-- Nike logo -->
  <circle cx="200" cy="180" r="20" fill="#000000"/>
  <text x="200" y="187" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">NIKE</text>
  <text x="200" y="380" text-anchor="middle" fill="#666666" font-family="Arial" font-size="14">Kids Jeans</text>
  <text x="200" y="400" text-anchor="middle" fill="#999999" font-family="Arial" font-size="12">Professional Product Image</text>
